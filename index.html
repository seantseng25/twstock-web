<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股策略模擬</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台股策略">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="title" id="title">每日建議</div>
  <div class="sub" id="dataInfo"></div>
</header>
<div id="ota" class="ota hidden"></div>
<div id="status" class="status hidden"><div class="status-text"></div><div class="bar"><i></i></div></div>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="suggest"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>每日建議</span></button>
  <button data-tab="rank"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h6"/></svg><span>排行</span></button>
  <button data-tab="sim"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>百萬模擬</span></button>
  <button data-tab="mine"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg><span>我的帳戶</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>設定</span></button>
</nav>
<div id="sheet" class="sheet hidden">
  <div class="sheet-bg" data-act="closeSheet"></div>
  <div class="sheet-panel">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="x" data-act="closeSheet">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
